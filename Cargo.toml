[package]
name = "tailout"
version = "1.0.0"
edition = "2024"
description = "A small HEVC video editor and batch converter powered by FFmpeg"
rust-version = "1.95"

[dependencies]
anyhow = "1"
eframe = { version = "0.37", default-features = false, features = ["clipboard", "default_fonts", "glow", "x11", "wayland"] }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
find-msvc-tools = "0.1.14"

[profile.release]
lto = "thin"
strip = true
